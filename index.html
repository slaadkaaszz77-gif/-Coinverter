<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coinverter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1f1f1f;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        user-select: none;
      }
      .window {
        width: 100%;
        max-width: 432px;
        background: #ffffff;
        border-radius: 9px;
        border: 1px solid rgba(198, 198, 198, 0.9);
        box-shadow: 0 26px 64px -12px rgba(0,0,0,0.23), 0 8px 22px -6px rgba(0,0,0,0.12);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .titlebar {
        position: relative;
        height: 42px;
        padding: 0 14px;
        background: linear-gradient(to bottom, #fcfcfc, #f3f3f3);
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .traffic { display: flex; align-items: center; gap: 8px; z-index: 2; }
      .dot {
        width: 13px; height: 13px; border-radius: 50%;
        border: 1px solid transparent; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        padding: 0; background: transparent;
      }
      .dot svg { width: 7px; height: 7px; opacity: 0; transition: opacity 0.12s; }
      .traffic:hover .dot svg { opacity: 1; }
      .dot-red { background: #ff5f56; border-color: #e0443e; color: #780000; }
      .dot-yellow { background: #ffbd2e; border-color: #dea123; color: #6b4a00; }
      .dot-green { background: #27c93f; border-color: #1aab29; color: #004d00; }
      .title {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 400; color: #333333;
        pointer-events: none;
      }
      .icon-btn {
        z-index: 2; border: none; background: transparent; cursor: pointer;
        color: #7a7a7a; padding: 6px; border-radius: 5px;
        display: flex; align-items: center; justify-content: center;
        transition: color 0.15s, background 0.15s;
      }
      .icon-btn:hover { color: #222222; background: rgba(0,0,0,0.05); }
      .icon-btn.active { color: #007aff; background: rgba(0,122,255,0.1); }
      .row {
        padding: 0 28px;
        border-bottom: 1px solid #eaeaea;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: #ffffff;
        transition: background 0.15s;
      }
      .row:last-child { border-bottom: none; }
      .row:hover { background: #fafafa; }
      .row.focused { background: #fafcff; }
      .row-primary { height: 86px; border-bottom: 1px solid #e5e5e5; }
      .row-primary:hover { background: #ffffff; }
      .row-primary.focused { background: #fafcff; }
      .row-secondary { height: 60px; }
      .currency-btn {
        border: none; background: transparent; cursor: pointer;
        display: flex; align-items: center; gap: 12px; padding: 4px 0; flex-shrink: 0;
      }
      .flag-wrap { width: 30px; display: flex; align-items: center; justify-content: center; }
      .flag {
        width: 28px; height: 19px; border-radius: 2px;
        box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.16); display: block;
      }
      .coin {
        width: 28px; height: 28px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      }
      .symbol { font-size: 14px; color: #666666; }
      .row-primary .symbol { font-size: 16px; }
      .currency-btn:hover .symbol { color: #1f1f1f; }
      .input-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; }
      .amount-input {
        width: 100%; border: none; outline: none; background: transparent;
        text-align: right; font-family: inherit;
        font-variant-numeric: tabular-nums; color: #1e1e1e;
      }
      .row-primary .amount-input { font-size: 40px; font-weight: 300; line-height: 1.1; letter-spacing: -0.02em; color: #1a1a1a; }
      .row-secondary .amount-input { font-size: 20px; font-weight: 400; line-height: 1.2; }
      .unit-rate { font-size: 11px; color: #999999; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .footer {
        height: 44px; padding: 0 16px;
        background: #fcfcfc; border-top: 1px solid #e4e4e4;
        display: flex; align-items: center; justify-content: space-between;
      }
      .status { font-size: 13px; color: #6d6d6d; font-variant-numeric: tabular-nums; }
      .status.error { color: #c82333; }
      .spin { animation: spin 0.9s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      /* Settings */
      .settings-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 16px; border-bottom: 1px solid #eaeaea; background: #fafafa;
      }
      .link-btn {
        border: none; background: transparent; color: #007aff;
        font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
      }
      .settings-body { max-height: 400px; overflow-y: auto; }
      .setting-group { padding: 14px 20px; border-bottom: 1px solid #eaeaea; display: flex; flex-direction: column; gap: 12px; }
      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #444; }
      .seg { display: inline-flex; padding: 2px; background: #efefef; border-radius: 6px; }
      .seg button {
        border: none; background: transparent; padding: 4px 10px; font-size: 12px;
        border-radius: 5px; cursor: pointer; color: #666; font-family: inherit;
      }
      .seg button.active { background: #fff; color: #1f1f1f; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
      .cur-list-title { padding: 8px 20px; font-size: 12px; font-weight: 500; color: #888; }
      .cur-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 20px; border-top: 1px solid #f2f2f2;
      }
      .cur-toggle {
        flex: 1; display: flex; align-items: center; gap: 12px;
        border: none; background: transparent; cursor: pointer; text-align: left; font-family: inherit;
      }
      .chk {
        width: 16px; height: 16px; border-radius: 4px; border: 1px solid #ccc;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .chk.on { background: #007aff; border-color: #007aff; color: #fff; }
      .move-btns { display: flex; gap: 4px; }
      .move-btn {
        border: none; background: transparent; color: #777; cursor: pointer;
        padding: 4px 6px; border-radius: 4px; font-size: 12px;
      }
      .move-btn:hover:not(:disabled) { background: #efefef; color: #1f1f1f; }
      .move-btn:disabled { opacity: 0.25; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <section class="window" aria-label="Coinverter">
        <header class="titlebar">
          <div class="traffic">
            <button class="dot dot-red" id="btnReset" title="Сбросить сумму" aria-label="Сбросить сумму">
              <svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 1.5L6.5 6.5M6.5 1.5L1.5 6.5"/></svg>
            </button>
            <button class="dot dot-yellow" id="btnCompact" title="Компактный вид" aria-label="Компактный вид">
              <svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 4H6.5"/></svg>
            </button>
            <button class="dot dot-green" id="btnRates" title="Показать курс за 1 ед." aria-label="Показать курс за 1 ед.">
              <svg viewBox="0 0 8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 1.5V6.5M1.5 4H6.5"/></svg>
            </button>
          </div>
          <h1 class="title">Coinverter</h1>
          <button class="icon-btn" id="btnShare" title="Скопировать результаты" aria-label="Скопировать результаты">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 2.75V12.25"/><path d="M6.75 5.75L10 2.5L13.25 5.75"/>
              <path d="M6.5 8.5H5C4.17 8.5 3.5 9.17 3.5 10V16C3.5 16.83 4.17 17.5 5 17.5H15C15.83 17.5 16.5 16.83 16.5 16V10C16.5 9.17 15.83 8.5 15 8.5H13.5"/>
            </svg>
          </button>
        </header>

        <div id="content"></div>

        <footer class="footer">
          <button class="icon-btn" id="btnRefresh" title="Обновить курсы валют" aria-label="Обновить курсы валют">
            <svg id="refreshIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
          </button>
          <div class="status" id="footerStatus">Загрузка курсов...</div>
          <button class="icon-btn" id="btnSettings" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </footer>
      </section>
    </main>

    <script>
      const CATALOG = {
        KGS: { code: 'KGS', symbol: 'сом', nameRu: 'Кыргызский сом', dec: 2 },
        RUB: { code: 'RUB', symbol: '₽', nameRu: 'Российский рубль', dec: 2 },
        USD: { code: 'USD', symbol: '$', nameRu: 'Доллар США', dec: 2 },
        EUR: { code: 'EUR', symbol: '€', nameRu: 'Евро', dec: 2 },
        GBP: { code: 'GBP', symbol: '£', nameRu: 'Фунт стерлингов', dec: 2 },
        JPY: { code: 'JPY', symbol: '¥', nameRu: 'Японская иена', dec: 2 },
        BTC: { code: 'BTC', symbol: 'BTC', nameRu: 'Биткоин', crypto: true, dec: 6 },
        CNY: { code: 'CNY', symbol: '¥', nameRu: 'Китайский юань', dec: 2 },
        CHF: { code: 'CHF', symbol: '₣', nameRu: 'Швейцарский франк', dec: 2 },
        TRY: { code: 'TRY', symbol: '₺', nameRu: 'Турецкая лира', dec: 2 },
        KZT: { code: 'KZT', symbol: '₸', nameRu: 'Казахстанский тенге', dec: 2 },
        AED: { code: 'AED', symbol: 'د.إ', nameRu: 'Дирхам ОАЭ', dec: 2 },
        ETH: { code: 'ETH', symbol: 'ETH', nameRu: 'Эфириум', crypto: true, dec: 5 },
      };

      const STORAGE_KEY = 'coinverter_standalone_v1';
      let settings = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (saved && Array.isArray(saved.active) && saved.active.length >= 2) return saved;
        } catch {}
        return { active: ['KGS', 'USD', 'EUR', 'GBP', 'JPY', 'BTC', 'RUB'], sep: ',', prec: 'auto' };
      })();

      let rates = null;
      let updatedAt = null;
      let loading = true;
      let fetchError = null;
      let editingCode = settings.active[0];
      let editingRaw = '30000';
      let focusedCode = null;
      let showSettings = false;
      let compactMode = false;
      let showUnitRates = false;
      let notice = null;
      let noticeTimer = null;

      function flagSvg(code) {
        switch (code) {
          case 'KGS': {
            let rays = '';
            for (let i = 0; i < 16; i++) {
              const a = (i * 22.5 * Math.PI) / 180;
              rays += `<line x1="${(Math.cos(a)*3.8).toFixed(2)}" y1="${(Math.sin(a)*3.8).toFixed(2)}" x2="${(Math.cos(a)*6.4).toFixed(2)}" y2="${(Math.sin(a)*6.4).toFixed(2)}" stroke="#FFEF00" stroke-width="0.65" stroke-linecap="round"/>`;
            }
            return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#E8112D"/><g transform="translate(15,10)">${rays}<circle r="3.4" fill="#FFEF00"/><circle r="2.7" fill="#E8112D"/><path d="M-2.2 -1.2Q0 0 2.2 -1.2M-2.2 1.2Q0 0 2.2 1.2M-1.2 -2.2Q0 0 -1.2 2.2M1.2 -2.2Q0 0 1.2 2.2" fill="none" stroke="#FFEF00" stroke-width="0.55"/></g></svg>`;
          }
          case 'RUB': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="6.67" fill="#fff"/><rect width="30" height="6.67" y="6.67" fill="#0039A6"/><rect width="30" height="6.67" y="13.33" fill="#D52B1E"/></svg>`;
          case 'USD': {
            let stripes = '';
            for (let i = 0; i < 13; i += 2) stripes += `<rect y="${(i*20)/13}" width="30" height="${20/13}" fill="#B22234"/>`;
            return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/>${stripes}<rect width="13.5" height="${(20*7)/13}" fill="#3C3B6E"/></svg>`;
          }
          case 'EUR': {
            let stars = '';
            for (let i = 0; i < 12; i++) {
              const a = (i * 30 * Math.PI) / 180;
              stars += `<circle cx="${(Math.cos(a)*6).toFixed(2)}" cy="${(Math.sin(a)*6).toFixed(2)}" r="0.85"/>`;
            }
            return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#003399"/><g fill="#FFCC00" transform="translate(15,10)">${stars}</g></svg>`;
          }
          case 'GBP': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0,0L30,20M30,0L0,20" stroke="#fff" stroke-width="3.6"/><path d="M0,0L30,20M30,0L0,20" stroke="#C8102E" stroke-width="1.8"/><path d="M15,0V20M0,10H30" stroke="#fff" stroke-width="5.4"/><path d="M15,0V20M0,10H30" stroke="#C8102E" stroke-width="3.2"/></svg>`;
          case 'JPY': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.5" fill="#BC002D"/></svg>`;
          case 'BTC': return `<div class="coin" style="background:#F7931A"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M16.65 10.62c.3-1.99-1.22-3.06-3.29-3.77l.67-2.7-1.64-.41-.66 2.63c-.43-.11-.87-.21-1.31-.31l.66-2.65-1.64-.41-.67 2.7c-.36-.08-.71-.16-1.05-.25l-2.26-.56-.44 1.75s1.22.28 1.19.3c.66.17.78.61.76.96l-.77 3.07c.05.01.11.03.18.06l-.18-.05-1.07 4.3c-.08.2-.29.5-.75.39.02.02-1.19-.3-1.19-.3l-.81 1.88 2.13.53c.4.1.79.2 1.17.3l-.68 2.73 1.64.41.67-2.7c.45.12.88.23 1.31.34l-.67 2.68 1.64.41.68-2.72c2.8.53 4.91.32 5.79-2.22.71-2.04-.04-3.21-1.51-3.98 1.07-.25 1.88-.96 2.1-2.42zm-3.76 5.26c-.51 2.04-3.94.94-5.05.66l.9-3.61c1.11.28 4.68.83 4.15 2.95zm.51-5.29c-.46 1.85-3.32.91-4.25.68l.82-3.28c.93.23 3.91.67 3.43 2.6z"/></svg></div>`;
          case 'ETH': return `<div class="coin" style="background:#627EEA"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2L5.5 12.2L12 16L18.5 12.2L12 2ZM12 17.5L5.5 13.7L12 22L18.5 13.7L12 17.5Z"/></svg></div>`;
          case 'CNY': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#DE2910"/><polygon points="5,2.5 5.8,5 8.4,5 6.3,6.5 7.1,9 5,7.4 2.9,9 3.7,6.5 1.6,5 4.2,5" fill="#FFDE00"/></svg>`;
          case 'CHF': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#D52B1E"/><rect x="13" y="4.5" width="4" height="11" fill="#fff"/><rect x="9.5" y="8" width="11" height="4" fill="#fff"/></svg>`;
          case 'TRY': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#E30A17"/><circle cx="11.5" cy="10" r="4.8" fill="#fff"/><circle cx="12.8" cy="10" r="3.8" fill="#E30A17"/><circle cx="17.8" cy="10" r="1.4" fill="#fff"/></svg>`;
          case 'KZT': return `<svg class="flag" viewBox="0 0 30 20"><rect width="30" height="20" fill="#00AFCA"/><circle cx="15" cy="9.5" r="4.2" fill="#FEC50C"/></svg>`;
          case 'AED': return `<svg class="flag" viewBox="0 0 30 20"><rect x="7.5" width="22.5" height="6.67" fill="#00732F"/><rect x="7.5" y="6.67" width="22.5" height="6.67" fill="#fff"/><rect x="7.5" y="13.33" width="22.5" height="6.67" fill="#000"/><rect width="7.5" height="20" fill="#F00"/></svg>`;
        }
      }

      function parseInput(raw) {
        const n = Number(String(raw).replace(/\s+/g, '').replace(',', '.'));
        return Number.isFinite(n) && n >= 0 ? n : 0;
      }

      function convert(amount, from, to) {
        if (!rates || !amount) return 0;
        if (from === to) return amount;
        return (amount / rates[from]) * rates[to];
      }

      function fmt(val, code) {
        if (!Number.isFinite(val) || val === 0) return '0';
        const m = CATALOG[code];
        let d = m.dec;
        if (settings.prec === 'fixed2') d = m.crypto && Math.abs(val) < 0.01 ? 6 : 2;
        else if (settings.prec === 'fixed4') d = 4;
        else if (m.crypto) d = Math.abs(val) >= 10 ? 2 : Math.abs(val) >= 1 ? 4 : 6;
        let s = val.toFixed(d);
        if (settings.prec === 'auto') s = s.replace(/\.?0+$/, '');
        return settings.sep === ',' ? s.replace('.', ',') : s;
      }

      function saveSettings() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch {}
      }

      function updateFooter() {
        const el = document.getElementById('footerStatus');
        const icon = document.getElementById('refreshIcon');
        icon.classList.toggle('spin', loading);
        el.classList.toggle('error', Boolean(fetchError && !notice));
        if (notice) el.textContent = notice;
        else if (loading) el.textContent = 'Обновление...';
        else if (fetchError) el.textContent = fetchError;
        else if (updatedAt) {
          const hh = String(updatedAt.getHours()).padStart(2, '0');
          const mm = String(updatedAt.getMinutes()).padStart(2, '0');
          el.textContent = `Обновлено ${hh}:${mm}`;
        }
      }

      function showNotice(text) {
        clearTimeout(noticeTimer);
        notice = text;
        updateFooter();
        noticeTimer = setTimeout(() => { notice = null; updateFooter(); }, 2200);
      }

      async function fetchRates() {
        loading = true; fetchError = null; updateFooter();
        try {
          const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', { cache: 'no-store' });
          const json = await res.json();
          const next = { USD: 1 };
          Object.keys(CATALOG).forEach(c => {
            const v = json?.usd?.[c.toLowerCase()];
            if (typeof v === 'number' && v > 0) next[c] = v;
          });
          rates = next; updatedAt = new Date();
        } catch {
          try {
            const [f, c] = await Promise.all([
              fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' }),
              fetch('https://api.coinbase.com/v2/exchange-rates?currency=USD', { cache: 'no-store' })
            ]);
            const fj = await f.json(); const cj = await c.json();
            const next = { USD: 1 };
            Object.keys(CATALOG).forEach(k => { if (fj?.rates?.[k]) next[k] = fj.rates[k]; });
            ['BTC', 'ETH'].forEach(k => { const v = parseFloat(cj?.data?.rates?.[k]); if (v > 0) next[k] = v; });
            rates = next; updatedAt = new Date();
          } catch {
            fetchError = 'Ошибка загрузки курсов';
          }
        } finally {
          loading = false;
          render();
        }
      }

      function syncInputs() {
        const baseAmt = parseInput(editingRaw);
        document.querySelectorAll('.amount-input').forEach(inp => {
          const code = inp.dataset.code;
          if (code === editingCode) return;
          inp.value = rates ? fmt(convert(baseAmt, editingCode, code), code) : '—';
        });
      }

      function render() {
        updateFooter();
        document.getElementById('btnSettings').classList.toggle('active', showSettings);
        const content = document.getElementById('content');

        if (showSettings) {
          const allCodes = Object.keys(CATALOG);
          const inactive = allCodes.filter(c => !settings.active.includes(c));
          content.innerHTML = `
            <div class="settings-head">
              <button class="link-btn" id="sBack">← Назад</button>
              <span style="font-size:13px;font-weight:500;">Настройки</span>
              <button class="link-btn" id="sDone">Готово</button>
            </div>
            <div class="settings-body">
              <div class="setting-group">
                <div class="setting-row">
                  <span>Разделитель дроби</span>
                  <div class="seg">
                    <button data-sep="," class="${settings.sep === ',' ? 'active' : ''}">Запятая</button>
                    <button data-sep="." class="${settings.sep === '.' ? 'active' : ''}">Точка</button>
                  </div>
                </div>
                <div class="setting-row">
                  <span>Точность</span>
                  <div class="seg">
                    <button data-prec="auto" class="${settings.prec === 'auto' ? 'active' : ''}">Авто</button>
                    <button data-prec="fixed2" class="${settings.prec === 'fixed2' ? 'active' : ''}">2 знака</button>
                    <button data-prec="fixed4" class="${settings.prec === 'fixed4' ? 'active' : ''}">4 знака</button>
                  </div>
                </div>
              </div>
              <div class="cur-list-title">Активные валюты</div>
              ${settings.active.map((c, idx) => `
                <div class="cur-item">
                  <button class="cur-toggle" data-toggle="${c}">
                    <span class="chk on">✓</span>
                    <div class="flag-wrap">${flagSvg(c)}</div>
                    <span style="font-size:13px;color:#222">${CATALOG[c].nameRu}</span>
                    <span style="font-size:12px;color:#888">${CATALOG[c].symbol}</span>
                  </button>
                  <div class="move-btns">
                    <button class="move-btn" data-move="${idx}:-1" ${idx === 0 ? 'disabled' : ''}>↑</button>
                    <button class="move-btn" data-move="${idx}:1" ${idx === settings.active.length - 1 ? 'disabled' : ''}>↓</button>
                  </div>
                </div>
              `).join('')}
              ${inactive.length ? `<div class="cur-list-title">Доступные для добавления</div>${inactive.map(c => `
                <div class="cur-item">
                  <button class="cur-toggle" data-toggle="${c}">
                    <span class="chk"></span>
                    <div class="flag-wrap">${flagSvg(c)}</div>
                    <span style="font-size:13px;color:#333">${CATALOG[c].nameRu}</span>
                    <span style="font-size:12px;color:#888">${CATALOG[c].symbol}</span>
                  </button>
                </div>
              `).join('')}` : ''}
            </div>`;
          content.querySelector('#sBack').onclick = content.querySelector('#sDone').onclick = () => { showSettings = false; render(); };
          content.querySelectorAll('[data-sep]').forEach(b => b.onclick = () => { settings.sep = b.dataset.sep; saveSettings(); render(); });
          content.querySelectorAll('[data-prec]').forEach(b => b.onclick = () => { settings.prec = b.dataset.prec; saveSettings(); render(); });
          content.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
            const code = b.dataset.toggle;
            if (settings.active.includes(code)) {
              if (settings.active.length <= 2) return;
              settings.active = settings.active.filter(x => x !== code);
              if (!settings.active.includes(editingCode)) { editingCode = settings.active[0]; editingRaw = '0'; }
            } else settings.active.push(code);
            saveSettings(); render();
          });
          content.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
            const [i, d] = b.dataset.move.split(':').map(Number);
            const arr = settings.active; const [m] = arr.splice(i, 1); arr.splice(i + d, 0, m);
            saveSettings(); render();
          });
          return;
        }

        const list = compactMode ? settings.active.slice(0, 3) : settings.active;
        const primary = list[0];
        const baseAmt = parseInput(editingRaw);

        content.innerHTML = list.map((code, i) => {
          const m = CATALOG[code];
          const val = code === editingCode ? editingRaw : (rates ? fmt(convert(baseAmt, editingCode, code), code) : '—');
          const unit = showUnitRates && rates && i > 0 ? `<div class="unit-rate">1 ${primary} = ${fmt(convert(1, primary, code), code)} ${code}</div>` : '';
          return `
            <div class="row ${i === 0 ? 'row-primary' : 'row-secondary'} ${focusedCode === code ? 'focused' : ''}">
              <button class="currency-btn" data-promote="${code}" title="${m.nameRu}">
                <div class="flag-wrap">${flagSvg(code)}</div>
                <span class="symbol">${m.symbol}</span>
              </button>
              <div class="input-col">
                <input class="amount-input" data-code="${code}" type="text" inputmode="decimal" value="${val}" aria-label="${m.nameRu}" />
                ${unit}
              </div>
            </div>`;
        }).join('');

        content.querySelectorAll('.amount-input').forEach(inp => {
          const code = inp.dataset.code;
          inp.onfocus = () => {
            focusedCode = code;
            inp.closest('.row').classList.add('focused');
            if (code !== editingCode && rates) {
              const v = fmt(convert(parseInput(editingRaw), editingCode, code), code);
              editingCode = code;
              editingRaw = v === '0' ? '' : v;
              inp.value = editingRaw;
            }
          };
          inp.onblur = () => {
            focusedCode = null;
            inp.closest('.row')?.classList.remove('focused');
            if (code === editingCode && inp.value.trim() === '') {
              editingRaw = '0'; inp.value = '0'; syncInputs();
            }
          };
          inp.oninput = () => {
            editingCode = code;
            editingRaw = inp.value.replace(/[^\d.,]/g, '');
            inp.value = editingRaw;
            syncInputs();
          };
        });

        content.querySelectorAll('[data-promote]').forEach(btn => {
          btn.onclick = () => {
            const code = btn.dataset.promote;
            if (settings.active[0] === code) {
              content.querySelector(`.amount-input[data-code="${code}"]`)?.focus();
              return;
            }
            if (rates) {
              editingRaw = fmt(convert(parseInput(editingRaw), editingCode, code), code);
              editingCode = code;
            }
            settings.active = [code, ...settings.active.filter(c => c !== code)];
            saveSettings(); render();
          };
        });
      }

      document.getElementById('btnRefresh').onclick = fetchRates;
      document.getElementById('btnSettings').onclick = () => { showSettings = !showSettings; render(); };
      document.getElementById('btnCompact').onclick = () => { compactMode = !compactMode; render(); };
      document.getElementById('btnRates').onclick = () => { showUnitRates = !showUnitRates; render(); };
      document.getElementById('btnReset').onclick = () => { editingRaw = '0'; render(); showNotice('Сумма сброшена'); };
      document.getElementById('btnShare').onclick = async () => {
        if (!rates) return;
        const baseAmt = parseInput(editingRaw);
        const lines = settings.active.map(c => `${CATALOG[c].symbol} ${c === editingCode ? editingRaw : fmt(convert(baseAmt, editingCode, c), c)} (${c})`);
        try {
          await navigator.clipboard.writeText(`Coinverter:\n${lines.join('\n')}`);
          showNotice('Скопировано в буфер');
        } catch { showNotice('Не удалось скопировать'); }
      };

      render();
      fetchRates();
    </script>
  </body>
</html>
